name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "29"
            elixir: "1.20.2"
            lint: true
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

      - run: mix test --include differential --include es6_corpus

      - if: matrix.lint && startsWith(github.ref, 'refs/tags/v')
        run: RFC8785_ES6_CORPUS_N=100000000 mix test --only es6_corpus

      - if: matrix.lint
        run: mix format --check-formatted

      - if: matrix.lint
        run: mix credo --strict

      - if: matrix.lint
        run: mix dialyzer

      - if: matrix.lint
        run: mix docs --warnings-as-errors

      - if: matrix.lint
        run: MIX_ENV=prod mix compile --warnings-as-errors

      - if: matrix.lint
        run: mix hex.build
